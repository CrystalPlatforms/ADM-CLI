name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: adm -v
        run: node ./bin/adm -v
      - name: adm config --json
        run: node ./bin/adm config --json
      - name: npm test
        run: npm test

  dry-run-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: plan jq via apt (dry run, no changes)
        run: ADM_DRY_RUN=1 ADM_TOOLS=jq node ./bin/adm
